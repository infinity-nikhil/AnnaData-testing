<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Badge Rounded Container with Neon Emerald Border -->
  <rect x="2" y="4" width="26" height="26" rx="7" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
  
  <!-- Wheat / Grain Icon inside Badge -->
  <g transform="translate(6.5, 8.5) scale(0.72)" stroke="#00f59b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="m2 22 10-10"/>
    <path d="m16 8-4.5 4.5"/>
    <path d="M9.8 6.5C10.5 5.8 11.4 5.3 12.4 5c.4 1-.1 1.9-.8 2.6L8.5 10.7c-.7.7-1.6 1.2-2.6.8-.3-1 .2-1.9.9-2.6z"/>
    <path d="m12.7 3.6c.7-.7 1.6-1.2 2.6-.9.4 1-.1 1.9-.8 2.6L11.4 8.4c-.7.7-1.6 1.2-2.6.8-.3-1 .2-1.9.9-2.6z"/>
    <path d="m15.5 6.4c.7-.7 1.6-1.2 2.6-.8.4 1-.1 1.9-.8 2.6L14.2 11.3c-.7.7-1.6 1.2-2.6.8-.3-1 .2-1.9.9-2.6z"/>
    <path d="m18.4 9.3c.7-.7 1.6-1.2 2.6-.9.4 1-.1 1.9-.8 2.6L17.1 14.1c-.7.7-1.6 1.2-2.6.8-.3-1 .2-1.9.9-2.6z"/>
    <path d="m14.2 16.9.9-2.6c.7-.7 1.6-1.2 2.6-.9.4 1-.1 1.9-.8 2.6l-3.1 3.1z"/>
